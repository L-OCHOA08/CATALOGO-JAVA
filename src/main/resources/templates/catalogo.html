<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 960px; margin-inline: auto; }
    nav a { margin-right: .75rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .precio { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Catálogo</h1>
  <nav>
    <a th:href="@{/}">Todos</a>
    <a th:each="c : ${categorias}" th:href="@{/categoria/{s}(s=${c.slug})}" th:text="${c.nombre}">Cat</a>
  </nav>

  <p th:if="${productos.empty}">No hay productos para mostrar.</p>

  <div class="grid">
    <div class="card" th:each="p : ${productos.content}">
      <img th:if="${p.imagen}" th:src="@{/uploads/{f}(f=${p.imagen})}" th:alt="${p.nombre}" style="width:100%;height:160px;object-fit:cover;border-radius:6px">
      <h3 th:text="${p.nombre}">Nombre</h3>
      <p th:text="${p.descripcion}">Descripción</p>
      <p class="precio" th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">$ 0</p>
      <a th:href="'https://wa.me/5491164909268?text=' + ${#uris.escapePathSegment('Hola, me interesa: ' + p.nombre)}"
         target="_blank">Consultar por WhatsApp</a>
    </div>
  </div>
</body>
</html>
